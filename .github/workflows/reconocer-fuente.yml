name: Reconocer fuente

# Paso previo a escribir un conector: mirar qué publica de verdad un organismo
# y en qué formato, y anotarlo. El entorno de desarrollo no alcanza los sitios
# públicos españoles; el runner sí.
#
# Existe por una lección concreta: en BDNS deduje el nombre de un campo del
# enumerado de parámetros de búsqueda, lo di por bueno y estaba mal. Suponer el
# formato de un PDF sería el mismo error a mayor escala.
on:
  workflow_dispatch:
    inputs:
      fuente:
        description: "Fuente a reconocer"
        type: choice
        options: [tcu, boe, ine, oci, congreso, placsp]
        default: tcu

permissions:
  contents: write

jobs:
  reconocer:
    runs-on: ubuntu-latest
    # Un reconocimiento son unas decenas de peticiones. Si tarda más que
    # esto, algo está colgado, y es mejor saberlo en veinte minutos que en
    # seis horas.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: instalar dependencias
        run: pip install httpx certifi cryptography pdfplumber openpyxl

      - name: explorar
        if: (inputs.fuente || 'tcu') != 'ine'
        run: python scripts/explorar_${{ inputs.fuente || 'tcu' }}.py

      # El INE no es una fuente de hechos sino una tabla de referencia: la de
      # municipios con su provincia, para situar lo local de BDNS, que cuelga
      # del nombre del municipio y de nada más.
      - name: capturar la relación de municipios del INE
        if: inputs.fuente == 'ine'
        run: python scripts/capturar_municipios_ine.py

      # Segunda fase: el reconocimiento dice QUÉ publica el organismo; esto
      # dice si se puede leer. Sólo hay script de anatomía para las fuentes
      # que resultaron ser PDF.
      - name: anatomía de los PDF
        if: (inputs.fuente || 'tcu') == 'tcu'
        run: |
          python scripts/anatomia_pdf_tcu.py \
            --salida docs/fuentes/tcu-anatomia-pdf.md \
            --detalle detalle-pdf/

      # El conector de TdC necesita un golden test, y un golden test necesita
      # una muestra real guardada (CLAUDE.md: obligatorio en parsers de
      # fuentes). El entorno de desarrollo no alcanza www.tcu.es, así que la
      # muestra se captura aquí y se commitea.
      #
      # Se elige el PDF de 2019 por ser el más pequeño (305 KB, 3 páginas) y
      # traer las mismas columnas que los demás. Es un documento oficial
      # público sobre partidos políticos —personas jurídicas—, no sobre
      # particulares: el perfil de columnas ya confirmó que la fila lleva NIF
      # de formación política, no de persona física.
      - name: capturar muestra golden
        if: (inputs.fuente || 'tcu') == 'tcu'
        run: |
          python scripts/capturar_muestra_tcu.py \
            --destino ingest/tests/golden/tcu_sancionadores_2019.pdf

      # El texto extraído nombra a personas: se sube como artefacto privado
      # del repositorio para poder escribir el parser mirando datos reales,
      # y NO se commitea. El informe que sí se commitea lleva sólo estructura.
      - name: guardar el detalle como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detalle-pdf-tcu
          path: detalle-pdf/
          retention-days: 7
          if-no-files-found: ignore

      # `always()`: si el reconocimiento se cae a medias, el informe parcial
      # sigue valiendo. Perderlo obliga a repetir la exploración contra un
      # servicio público, que es justo lo que no conviene hacer en bucle.
      - name: mostrar el informe en el resumen
        if: always()
        run: cat docs/fuentes/*-reconocimiento.md docs/fuentes/*-anatomia-pdf.md >> "$GITHUB_STEP_SUMMARY" || true

      # Mismo patrón que en `datos.yml`: no fusiona, rehace sobre el remoto.
      # Ver allí el porqué. Aquí son varios ficheros generados, así que se
      # apartan todos antes del reset.
      - name: publicar el informe
        if: always()
        run: |
          set -euo pipefail
          GUARDADO=$(mktemp -d)
          mkdir -p "$GUARDADO/docs" "$GUARDADO/golden"
          cp -r docs/fuentes "$GUARDADO/docs/" 2>/dev/null || true
          cp ingest/tests/golden/tcu_*.pdf "$GUARDADO/golden/" 2>/dev/null || true
          # Del BOE, sólo altos cargos; del BORME, texto con los nombres de
          # persona ya sustituidos (ver scripts/explorar_boe.py).
          cp ingest/tests/golden/boe_altos_cargos_muestra.json "$GUARDADO/golden/" 2>/dev/null || true
          cp ingest/tests/golden/borme_seccion1_muestra.txt "$GUARDADO/golden/" 2>/dev/null || true
          cp ingest/tests/golden/boe_altos_cargos_historico.json "$GUARDADO/golden/" 2>/dev/null || true
          cp -r ingest/tests/golden/boe_disposiciones "$GUARDADO/golden/" 2>/dev/null || true
          mkdir -p "$GUARDADO/datos"
          cp ingest/sinapsis_ingest/datos/municipios_ine.csv "$GUARDADO/datos/" 2>/dev/null || true
          cp -r ingest/tests/golden/oci "$GUARDADO/golden/" 2>/dev/null || true
          cp -r ingest/tests/golden/congreso "$GUARDADO/golden/" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for intento in 1 2 3 4 5; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            mkdir -p docs ingest/tests/golden
            cp -r "$GUARDADO/docs/fuentes" docs/ 2>/dev/null || true
            cp "$GUARDADO"/golden/tcu_*.pdf ingest/tests/golden/ 2>/dev/null || true
            cp "$GUARDADO"/golden/boe_*.json "$GUARDADO"/golden/borme_*.txt ingest/tests/golden/ 2>/dev/null || true
            cp -r "$GUARDADO"/golden/boe_disposiciones ingest/tests/golden/ 2>/dev/null || true
            mkdir -p ingest/sinapsis_ingest/datos
            cp "$GUARDADO"/datos/municipios_ine.csv ingest/sinapsis_ingest/datos/ 2>/dev/null || true
            cp -r "$GUARDADO"/golden/oci ingest/tests/golden/ 2>/dev/null || true
            cp -r "$GUARDADO"/golden/congreso ingest/tests/golden/ 2>/dev/null || true
            # Rutas explícitas, nunca `git add -A`: detalle-pdf/ lleva texto con
            # nombres de personas y está en .gitignore, pero la barrera que de
            # verdad importa es no pedir nunca que se añada todo.
            git add docs/fuentes/ || true
            git add ingest/tests/golden/tcu_*.pdf 2>/dev/null || true
            git add ingest/tests/golden/boe_altos_cargos_muestra.json 2>/dev/null || true
            git add ingest/tests/golden/borme_seccion1_muestra.txt 2>/dev/null || true
            git add ingest/tests/golden/boe_altos_cargos_historico.json 2>/dev/null || true
            git add ingest/tests/golden/boe_disposiciones/ 2>/dev/null || true
            git add ingest/sinapsis_ingest/datos/municipios_ine.csv 2>/dev/null || true
            # Autorizaciones a ex altos cargos: publicables por §12.
            git add ingest/tests/golden/oci/ 2>/dev/null || true
            # Diputados: cargos públicos del Congreso, publicables por §12.
            git add ingest/tests/golden/congreso/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "sin cambios"
              exit 0
            fi
            git commit --quiet -m "docs: reconocimiento de ${{ inputs.fuente || 'tcu' }}"
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "publicado en el intento $intento"
              exit 0
            fi
            echo "alguien empujó mientras tanto; se rehace sobre lo nuevo"
            sleep $((intento * 3))
          done
          echo "::error::no se pudo publicar el informe tras 5 intentos"
          exit 1
