name: CI

on:
  push:
    # Las ramas de trabajo también, para tener CI antes de abrir el PR.
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # pgx v5.10 exige >= 1.25.
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: go.mod está ordenado
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Ficheros sin formatear:"
            echo "$sin_formato"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=cover.out ./...

  ingest:
    name: ingest (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingest/pyproject.toml

      - name: dependencias del sistema
        # followthemoney compila PyICU desde fuente.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libicu-dev

      - name: instalar
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: pytest
        run: pytest --cov=sinapsis_ingest

  migrations:
    name: migraciones (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sinapsis
          POSTGRES_PASSWORD: sinapsis
          POSTGRES_DB: sinapsis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinapsis -d sinapsis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: sinapsis
      PGPASSWORD: sinapsis
      PGDATABASE: sinapsis
    steps:
      - uses: actions/checkout@v4

      - name: cliente de postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # up -> down -> up prueba que la migración es reversible y reaplicable.
      # Una migración que sólo se ha probado hacia adelante no es reversible,
      # es sólo una que aún no ha fallado.
      - name: aplicar 0001 up
        run: psql -v ON_ERROR_STOP=1 -q -f backend/migrations/0001_init.up.sql

      - name: el esquema tiene las tablas esperadas
        run: |
          faltan=""
          for t in sources raw_documents entities relationships provenance review_queue entity_resolution_decisions; do
            existe=$(psql -tAc "SELECT to_regclass('public.$t') IS NOT NULL;")
            [ "$existe" = "t" ] || faltan="$faltan $t"
          done
          if [ -n "$faltan" ]; then
            echo "Faltan tablas:$faltan"
            exit 1
          fi

      - name: revertir 0001 down
        run: psql -v ON_ERROR_STOP=1 -q -f backend/migrations/0001_init.down.sql

      - name: reaplicar 0001 up
        run: psql -v ON_ERROR_STOP=1 -q -f backend/migrations/0001_init.up.sql

  compose:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `config` resuelve variables, valida el esquema del fichero y detecta
      # referencias rotas entre servicios sin descargar ninguna imagen.
      - name: validar docker-compose.yml
        run: docker compose config --quiet
