name: Instantánea de datos

# Publica datos REALES sin necesidad de base de datos alojada ni de ninguna
# cuenta: ingiere contra un Postgres efímero, exporta el grafo a JSON y lo
# commitea. Vercel lo sirve como un activo más.
#
# Es una instantánea, no una consulta viva. Cuando el volumen lo pida, el
# camino es conectar Neon y usar la API (ver DESPLIEGUE.md); esto no estorba.
on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (AAAA-MM-DD)"
        default: "2025-01-01"
      hasta:
        description: "Fecha final (AAAA-MM-DD)"
        default: "2025-12-31"
      max_paginas:
        description: "Páginas por conector (1000 concesiones cada una)"
        default: "30"

permissions:
  contents: write

concurrency:
  group: instantanea
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sinapsis
          POSTGRES_PASSWORD: sinapsis
          POSTGRES_DB: sinapsis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sinapsis -d sinapsis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SINAPSIS_POSTGRES_DSN: postgres://sinapsis:sinapsis@localhost:5432/sinapsis
      PGHOST: localhost
      PGUSER: sinapsis
      PGPASSWORD: sinapsis
      PGDATABASE: sinapsis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libicu-dev postgresql-client

      - name: instalar
        working-directory: ingest
        run: pip install -e .

      - name: esquema
        run: |
          for f in $(ls backend/migrations/*.up.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Si una fuente pública falla, se registra el hueco y se sigue con las
      # demás: un conector caído no debe dejar la web sin actualizar.
      #
      # Pero «se registra» tiene que significar algo. El 18/9/2026 BDNS no
      # respondió, la instantánea salió con el 100 % de la procedencia en
      # PLACSP —sin subvenciones ni partidos— y el único rastro era una línea
      # perdida entre miles en el log. Ahora cada conector deja su resultado en
      # el resumen del job, que es donde se mira.
      #
      # Y tiene que poder LEERSE. El motivo por el que BDNS no
      # respondió el 18/9/2026 resultó inalcanzable: el resumen del job no lo
      # expone la API, y del log sólo se puede recuperar el final, que se lo
      # come el desmontaje de contenedores. Por eso el detalle del fallo se
      # guarda en fichero y se vuelca en un paso posterior — al final del job,
      # que es lo único que se puede leer después.
      - name: ingerir
        working-directory: ingest
        continue-on-error: true
        # Cinco conectores en vez de tres, y BDNS reintenta hasta tres veces por
        # página con esperas crecientes cuando el servicio va lento. El tope
        # sigue estando para que una fuente colgada no deje la web sin
        # actualizar, no para acotar el trabajo normal.
        timeout-minutes: 75
        run: |
          D="${{ inputs.desde || '2025-01-01' }}"
          H="${{ inputs.hasta || '2025-12-31' }}"
          # De 12 a 30. Con 12 páginas la base tenía 12.153 entidades y el
          # cuello no era el tiempo —la ingesta tardaba 12 de los 75 minutos—
          # sino el cupo. Los conectores limitan su propio ritmo (4 pet/s en
          # BDNS, 2 en la Plataforma), que es lo que evita castigar a un
          # servicio público.
          P="${{ inputs.max_paginas || '30' }}"
          : > /tmp/fuentes-caidas.txt

          ejecutar() {
            nombre="$1"; shift
            echo "::group::$nombre"
            set +e
            sinapsis-worker --run "$nombre" "$@" > "/tmp/log-$nombre.txt" 2>&1
            rc=$?
            set -e
            cat "/tmp/log-$nombre.txt"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              {
                echo "### $nombre (código $rc)"
                tail -n 6 "/tmp/log-$nombre.txt"
                echo
              } >> /tmp/fuentes-caidas.txt
              echo "::warning title=Fuente sin datos::$nombre no aportó nada a esta instantánea"
            fi
          }

          # EL ORDEN IMPORTA, y no por gusto: si el paso agota su tiempo, los
          # conectores que no llegaron a ejecutarse desaparecen de la
          # instantánea sin que nada más falle. Así que van primero los baratos
          # y los que no tienen sustituto.
          #
          # El Tribunal de Cuentas son cuatro PDF y es la ÚNICA fuente de
          # sanciones a partidos: iba el último y un tiempo agotado se llevaba
          # por delante los 630 expedientes sin dejar rastro. Los partidos, por
          # el mismo motivo. Los feeds de la Plataforma son los que más tardan
          # y los que mejor toleran quedarse a medias, porque cada página que
          # sí entró ya aportó sus contratos.
          #
          # El TdC ignora el rango de fechas: son cuatro PDF acumulativos que
          # el organismo reescribe. Se pasan igual porque el worker los exige,
          # y la idempotencia la da el content_hash.
          ejecutar tcu --desde "$D" --hasta "$H"

          # Las autorizaciones de la Oficina de Conflictos de Intereses: dos
          # peticiones —el buscador y su exportación— y la lista entera. Como el
          # TdC, ignora el rango de fechas.
          ejecutar oci --desde "$D" --hasta "$H"

          # Los diputados del Congreso por legislatura, desde la IX: una página y
          # un fichero por legislatura. Ignora el rango de fechas.
          ejecutar congreso --desde "$D" --hasta "$H"

          # La Plataforma publica tres feeds y hasta el 18/9/2026 sólo se
          # leía uno. `agregadas` trae lo que vuelcan las plataformas
          # autonómicas; `licitaciones` es el feed principal del Estado y
          # `menores` es el contrato menor, que es donde vive el gasto
          # municipal del día a día y el que más se pregunta.
          for c in bdns-partidos bdns placsp placsp-licitaciones placsp-menores; do
            ejecutar "$c" --desde "$D" --hasta "$H" --max-paginas "$P"
          done

      # Los altos cargos del BOE (fase 7, puertas giratorias).
      #
      # Paso propio, con su tiempo y su caché, porque su coste no se parece al
      # de los demás. El BOE no cambia —lo publicado un día sigue igual para
      # siempre—, así que cada día leído se guarda y la noche siguiente no se
      # vuelve a pedir. Sin caché serían quince años de sumarios cada noche.
      #
      # La caché se llena de lo reciente hacia atrás, como mucho
      # BOE_DIAS_NUEVOS días por noche: las primeras noches la sección de
      # cargos cubre sólo lo último, y lo dice (cargos.json lleva desde qué
      # fecha hay actos). Cuando está llena, este paso sólo lee disco.
      #
      # `restore` y `save` por separado, y el `save` con `always()`: si el paso
      # agota su tiempo, lo que sí se leyó se guarda igual. Con el `cache`
      # combinado sólo se guardaría si el job entero sale bien.
      - name: recuperar la caché del BOE
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cache-boe
          key: boe-${{ github.run_id }}
          restore-keys: boe-

      - name: ingerir altos cargos (BOE)
        working-directory: ingest
        continue-on-error: true
        timeout-minutes: 30
        env:
          SINAPSIS_CACHE_BOE: /tmp/cache-boe
          SINAPSIS_BOE_MAX_DIAS_NUEVOS: "500"
          # Por debajo del timeout del paso (30): el conector deja de pedir días
          # nuevos a los 24 minutos y termina bien, en vez de que el paso lo
          # corte a mitad.
          SINAPSIS_BOE_TOPE_MINUTOS: "24"
        run: |
          # Desde el gobierno de diciembre de 2011: los dos partidos que han
          # gobernado desde entonces, con sus altos cargos entrando y saliendo.
          set +e
          sinapsis-worker --run boe --desde 2011-12-01 --hasta "$(date -u +%F)" > /tmp/log-boe.txt 2>&1
          rc=$?
          set -e
          cat /tmp/log-boe.txt
          if [ "$rc" -ne 0 ]; then
            {
              echo "### boe (código $rc)"
              tail -n 6 /tmp/log-boe.txt
              echo
            } >> /tmp/fuentes-caidas.txt
            echo "::warning title=Fuente sin datos::boe no aportó nada a esta instantánea"
          fi
          echo "días en caché: $(find /tmp/cache-boe/sumarios -name '*.json' 2>/dev/null | wc -l)"

      - name: guardar la caché del BOE
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/cache-boe
          key: boe-${{ github.run_id }}

      # Acotado a propósito. Este paso propone fusiones para que las revise una
      # persona: no fusiona nada y la web no depende de él. El emparejamiento
      # difuso por trigramas crece mucho más rápido que el número de entidades,
      # y sin tope puede quedarse horas colgado — pasó el 18/9/2026, con la
      # ingesta terminada en 7 minutos y este paso 40 y subiendo, bloqueando la
      # exportación detrás.
      #
      # Que se corte es un hueco en una cola de revisión, recuperable en la
      # siguiente ejecución. Que no se publique la instantánea corregida, no.
      - name: proponer fusiones (no las aplica)
        working-directory: ingest
        continue-on-error: true
        timeout-minutes: 10
        run: sinapsis-worker --candidatos

      - name: exportar instantánea
        working-directory: ingest
        run: sinapsis-worker --exportar ../frontend/public/datos/grafo.json

      # El estado de las fuentes se COMMITEA, no se deja en el log.
      #
      # Intenté leerlo del resumen del job (la API no lo expone) y del log
      # (sólo se recupera el final, y se lo comen el eco del script de
      # publicación y el desmontaje de contenedores: tres tamaños de ventana
      # distintos y el tramo nunca entró). Un diagnóstico que no se puede leer
      # no es un diagnóstico.
      #
      # En fichero versionado sí: se lee con un `git pull`, queda histórico de
      # qué días falló cada organismo, y de paso es público, que para un
      # proyecto de transparencia no está de más.
      - name: registrar el estado de las fuentes
        if: always()
        run: |
          mkdir -p docs/fuentes
          {
            echo "# Estado de la última ingesta"
            echo
            echo "Generado automáticamente por el workflow «Instantánea de datos»."
            echo "Dice qué fuentes respondieron y qué aportaron al mapa publicado."
            echo
            echo "- Ejecución: \`$GITHUB_RUN_ID\` · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -s /tmp/fuentes-caidas.txt ]; then
              echo "## Fuentes que no aportaron"
              echo
              echo '```'
              cat /tmp/fuentes-caidas.txt
              echo '```'
            else
              echo "Todas las fuentes respondieron."
            fi
            echo
            echo "## Aporte al volcado"
            echo
            python3 - <<'PYEOF'
          import json
          d = json.load(open("frontend/public/datos/grafo.json"))
          print("| fuente | entidades en el mapa |")
          print("| --- | ---: |")
          for f in d.get("fuentes", []):
              n = f.get("entidades", 0)
              print(f"| {f['name']} | {n if n else '**0 — no aportó**'} |")
          PYEOF
            echo
            echo "## Territorio de los organismos"
            echo
            python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open("frontend/public/datos/indice.json"))
          except (OSError, ValueError):
              print("Sin índice: no se pudo contar.")
              raise SystemExit(0)
          print(f"- del Estado: {d.get('organismosEstatales', 0)}")
          print(f"- con comunidad: {sum(t['organismos'] for t in d.get('territorios', []))}")
          print(f"- **sin clasificar: {d.get('organismosSinTerritorio', 0)}**")
          print()
          print("Jerarquías más repetidas entre los sin clasificar (para afinar")
          print("`ingest/sinapsis_ingest/territorio.py`):")
          print()
          print("```")
          for j in d.get("jerarquiasSinClasificar", []):
              print(j)
          print("```")
          PYEOF
            echo
            echo "## Cargos públicos (BOE, OCI, Congreso)"
            echo
            echo "- días del BOE en caché: $(find /tmp/cache-boe/sumarios -name '*.json' 2>/dev/null | wc -l)"
            python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open("frontend/public/datos/cargos.json"))
          except (OSError, ValueError):
              print("- sin cargos.json en esta edición")
              raise SystemExit(0)
          print(f"- personas: {len(d.get('personas', []))} · actos del BOE: {d.get('nActos', 0)}")
          print(f"- actos del BOE leídos del {d.get('actosDesde')} al {d.get('actosHasta')}")
          fuentes = {}
          for p in d.get("personas", []):
              for f in {x.get("fuente", "boe") for x in p.get("periodos", [])}:
                  fuentes[f] = fuentes.get(f, 0) + 1
          print(f"- personas con algo de cada fuente: {fuentes}")
          print(f"- autorizaciones (OCI): {d.get('nAutorizaciones', 0)}")
          print(f"- actividades declaradas (Congreso): {d.get('nDeclaraciones', 0)}")
          print(f"- sociedades del mapa con un ex alto cargo autorizado: {len(d.get('empresas', {}))}")
          print(f"- entidades del mapa con un diputado que declaró trabajar en ellas: {len(d.get('declarantes', {}))}")
          print(f"- órganos del mapa con quién los dirigió: {len(d.get('organos', {}))}")
          PYEOF
          } > docs/fuentes/estado-ingesta.md
          cat docs/fuentes/estado-ingesta.md

      - name: resumen
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('frontend/public/datos/grafo.json'))
          print('### Instantánea generada')
          print()
          print(f"- generada: `{d['generado']}`")
          print(f"- nodos: **{len(d['nodes'])}**, aristas: **{len(d['edges'])}**")
          print(f"- entidades en base: {d['total_entidades_en_base']}")
          print(f"- recortada: {'sí' if d['truncado'] else 'no'}")
          print(f"- fuentes: {', '.join(f['id'] for f in d['fuentes']) or 'ninguna'}")
          PY

      # Publicar no puede fallar por una carrera con otro push.
      #
      # El reintento con `pull --rebase` no bastó: falló los cinco intentos.
      # Rebasar un commit sobre otro que toca el MISMO fichero generado deja un
      # conflicto, y en un conflicto el rebase se queda a medias y todo lo que
      # viene detrás falla también.
      #
      # Esto no puede conflictuar porque no fusiona nada: aparta el fichero
      # recién generado, se pone exactamente en el estado del remoto, vuelve a
      # dejar el fichero y commitea encima. El `reset --hard` sólo descarta el
      # árbol efímero del runner, y lo único que queremos conservar está a
      # salvo fuera.
      #
      # Es correcto porque grafo.json es un fichero GENERADO: no tiene cambios
      # ajenos que preservar, y la versión buena es siempre la que se acaba de
      # calcular.
      - name: publicar la instantánea
        run: |
          set -euo pipefail
          ARCHIVO=frontend/public/datos/grafo.json
          # El índice va con el grafo: lleva TODAS las entidades de la base,
          # sin aristas, para que la búsqueda no esté acotada por el tope del
          # mapa. Publicar uno sin el otro deja la web incoherente.
          INDICE=frontend/public/datos/indice.json
          # El extracto es lo que descarga TODO el mundo al entrar; el índice
          # completo, sólo quien busca. Publicar uno sin el otro deja la
          # portada con las listas de una instantánea y la búsqueda de otra.
          INDICE_TOP=frontend/public/datos/indice-top.json
          # Los altos cargos del BOE. El grafo dice cuántos trae (`cargos`), y
          # la web ofrece la sección por eso: un grafo que los anuncia sin el
          # fichero al lado dejaría una sección que no carga.
          CARGOS=frontend/public/datos/cargos.json
          ESTADO=docs/fuentes/estado-ingesta.md
          GUARDADO=$(mktemp)
          GUARDADO_INDICE=$(mktemp)
          GUARDADO_INDICE_TOP=$(mktemp)
          GUARDADO_ESTADO=$(mktemp)
          GUARDADO_CARGOS=$(mktemp)
          cp "$ARCHIVO" "$GUARDADO"
          cp "$INDICE" "$GUARDADO_INDICE" 2>/dev/null || : > "$GUARDADO_INDICE"
          cp "$INDICE_TOP" "$GUARDADO_INDICE_TOP" 2>/dev/null || : > "$GUARDADO_INDICE_TOP"
          cp "$ESTADO" "$GUARDADO_ESTADO" 2>/dev/null || : > "$GUARDADO_ESTADO"
          cp "$CARGOS" "$GUARDADO_CARGOS" 2>/dev/null || : > "$GUARDADO_CARGOS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for intento in 1 2 3 4 5; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$ARCHIVO")" "$(dirname "$ESTADO")"
            cp "$GUARDADO" "$ARCHIVO"
            # El `|| true` no es adorno: con `set -e`, un `[ -s x ] && cp`
            # cuyo test falla devuelve 1 y mata el paso entero. Que falte el
            # índice o el estado es un hueco tolerable; que no se publique la
            # instantánea por eso, no.
            [ -s "$GUARDADO_INDICE" ] && cp "$GUARDADO_INDICE" "$INDICE" || true
            [ -s "$GUARDADO_INDICE_TOP" ] && cp "$GUARDADO_INDICE_TOP" "$INDICE_TOP" || true
            [ -s "$GUARDADO_ESTADO" ] && cp "$GUARDADO_ESTADO" "$ESTADO" || true
            [ -s "$GUARDADO_CARGOS" ] && cp "$GUARDADO_CARGOS" "$CARGOS" || true
            # Los dos ficheros de datos están en .gitignore para que nadie suba
            # un volcado de pruebas a mano; la CI sí debe poder subirlos.
            git add -f "$ARCHIVO"
            [ -s "$GUARDADO_INDICE" ] && git add -f "$INDICE" || true
            [ -s "$GUARDADO_INDICE_TOP" ] && git add -f "$INDICE_TOP" || true
            [ -s "$GUARDADO_CARGOS" ] && git add -f "$CARGOS" || true
            git add "$ESTADO" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "sin cambios en los datos"
              exit 0
            fi
            git commit --quiet -m "datos: instantánea automática del grafo (no editar a mano)"
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "publicada en el intento $intento"
              exit 0
            fi
            echo "alguien empujó mientras tanto; se rehace sobre lo nuevo"
            sleep $((intento * 3))
          done
          echo "::error::no se pudo publicar la instantánea tras 5 intentos"
          exit 1
