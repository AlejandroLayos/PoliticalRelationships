[project]
name = "sinapsis-ingest"
version = "0.1.0"
description = "Workers de ingesta de Sinapsis: conectores a fuentes públicas españolas"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "followthemoney>=4.10,<5",
    "structlog>=24.1",
    # El Tribunal de Cuentas sólo publica PDF: no hay API, ni CSV, ni tablas
    # HTML. Comprobado, no supuesto — ver docs/fuentes/tcu-reconocimiento.md.
    "pdfplumber>=0.11",
    # La Oficina de Conflictos de Intereses publica las autorizaciones como
    # hoja de cálculo (el exportador del Portal de Transparencia). Ver
    # docs/fuentes/oci-reconocimiento.md.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Acotado por arriba a propósito. `ruff format` cambia de criterio entre
    # versiones menores: la CI instala la última publicada y en local había
    # otra, así que `ruff format` pasaba aquí y fallaba allí sobre los mismos
    # ficheros. Un fallo de formato corta el job antes de pytest, o sea que
    # los tests de integración dejaron de ejecutarse sin que nada lo dijera.
    "ruff>=0.16.8,<0.17",
    "respx>=0.21",
]

[project.scripts]
sinapsis-worker = "sinapsis_ingest.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sinapsis_ingest*"]

# La relación de municipios del INE viaja con el paquete: la ingesta no debe
# depender de que el INE responda para clasificar lo que ya sabe.
[tool.setuptools.package-data]
sinapsis_ingest = ["datos/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
